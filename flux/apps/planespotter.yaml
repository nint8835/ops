apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: planespotter
  namespace: flux-system
spec:
  interval: 1h0m0s
  dependsOn:
    - name: nfs-csi
  sourceRef:
    kind: ExternalArtifact
    name: planespotter
  path: './'
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: planespotter
      namespace: planespotter
  decryption:
    provider: sops
