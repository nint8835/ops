apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookorbit
  namespace: flux-system
spec:
  interval: 1h0m0s
  dependsOn:
    - name: cert-manager-configs
    - name: nfs-csi
    - name: cloudnativepg
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: 'flux/apps/bookorbit'
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: bookorbit
      namespace: bookorbit
  decryption:
    provider: sops
