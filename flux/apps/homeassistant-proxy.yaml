apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homeassistant-proxy
  namespace: flux-system
spec:
  interval: 1h0m0s
  dependsOn:
    - name: traefik-configs
    - name: cert-manager-configs
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: 'flux/apps/homeassistant-proxy'
  prune: true
