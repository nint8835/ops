apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: miniflux
  namespace: flux-system
spec:
  interval: 1h0m0s
  dependsOn:
    - name: nfs-csi
    - name: cloudnativepg
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: 'flux/apps/miniflux'
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: miniflux
      namespace: miniflux
  decryption:
    provider: sops
