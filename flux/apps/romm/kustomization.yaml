apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: romm

resources:
  - namespace.yaml
  - persistent_volume_claim.yaml
  - redis.yaml
  - service_redis.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

secretGenerator:
  - name: secrets
    envs:
      - secrets.env

images:
  - name: ghcr.io/rommapp/romm
    newTag: 5.4.1-slim@sha256:88d17c1ce5b5f9ecdce449061e72805ce7f2434a8646955d748f4967c1586e9b
  - name: ghcr.io/valkey-io/valkey
    newTag: 9.2.0-alpine@sha256:4d67e1af80c653bd46c0bbe8de438c81a6535ab5a39b22f2100028f314005663
