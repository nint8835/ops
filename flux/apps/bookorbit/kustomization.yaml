apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bookorbit

resources:
  - namespace.yaml
  - database_cluster.yaml
  - database.yaml
  - persistent_volume_claim.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

secretGenerator:
  - name: secrets
    envs:
      - secrets.env

images:
  - name: ghcr.io/bookorbit/bookorbit
    newTag: 3.7.0@sha256:0d5f4a31576a2bcd96afa77b8eac75c3b8df395f0f9b9215995de59236f22b95
