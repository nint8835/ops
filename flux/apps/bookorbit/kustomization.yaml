apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bookorbit

resources:
  - namespace.yaml
  - database_cluster.yaml
  - database.yaml
  - persistent_volume_claim.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

secretGenerator:
  - name: secrets
    envs:
      - secrets.env

images:
  - name: ghcr.io/bookorbit/bookorbit
    newTag: 3.4.0@sha256:99539be044c94f10fa5fba616cb08e1b128deb4996c975d181a950818a8632e4
