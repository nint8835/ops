apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: happier
  namespace: flux-system
spec:
  interval: 1h0m0s
  dependsOn:
    - name: traefik-configs
    - name: cert-manager-configs
    - name: nfs-csi
  sourceRef:
    kind: ExternalArtifact
    name: happier
  path: './'
  prune: true
  decryption:
    provider: sops
