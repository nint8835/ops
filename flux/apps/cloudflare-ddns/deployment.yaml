apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudflare-ddns

spec:
  selector:
    matchLabels:
      app: cloudflare-ddns
  
  template:
    metadata:
      labels:
        app: cloudflare-ddns
    
    spec:
      containers:
        - name: cloudflare-ddns
          image: favonia/cloudflare-ddns

          env:
            - name: DOMAINS
              value: ingress.bootleg.technology
            - name: PROXIED
              value: "false"
            - name: IP6_PROVIDER
              value: none
          
          envFrom:
            - secretRef:
                name: secrets
      
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
