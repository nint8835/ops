apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: coder

resources:
  - namespace.yaml
  - database.yaml
  - helm_repo.yaml
  - secrets.yaml
  - helm_release.yaml

configurations:
  - kustomizeconfig.yaml

secretGenerator:
  - name: ares-docker-creds
    files:
      - docker-creds/ca.pem
      - docker-creds/cert.pem
      - docker-creds/key.pem
    options:
      # These files are loaded at terraform apply time, so we don't need to redeploy Coder any time they change
      disableNameSuffixHash: true
