apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: happier
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: traefik-https-redirect@kubernetescrd

spec:
  tls:
    - hosts:
        - agents.bootleg.technology
      secretName: happier-tls
  rules:
    - host: agents.bootleg.technology
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: happier-server
                port:
                  name: http
