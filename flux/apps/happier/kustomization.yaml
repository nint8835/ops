apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: happier

resources:
  - namespace.yaml
  - persistent_volume_claim.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: config
    envs:
      - config.env

secretGenerator:
  - name: secrets
    envs:
      - secrets.env

images:
  - name: ghcr.io/happier-dev/relay-server
    newTag: stable@sha256:e869bacb874089e8cd2ca1be488551710994035ef7f9631f1876f0f33f5f8534
