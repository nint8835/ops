apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: happier

resources:
  - namespace.yaml
  - persistent_volume_claim.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: config
    envs:
      - config.env

secretGenerator:
  - name: secrets
    envs:
      - secrets.env

images:
  - name: ghcr.io/happier-dev/relay-server
    newTag: stable@sha256:af8a9c54b0d9500c1ac12f2798fdcbbbecb66485678024730b6f00b842445a09
