apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: happier

resources:
  - namespace.yaml
  - persistent_volume_claim.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: config
    envs:
      - config.env

secretGenerator:
  - name: secrets
    envs:
      - secrets.env

images:
  - name: ghcr.io/happier-dev/relay-server
    newTag: stable@sha256:7791e51ec6411dc81ebdf553a651313f56b52dc02259058cf52d038f3716e36f
