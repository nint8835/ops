apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: happier

resources:
  - namespace.yaml
  - persistent_volume_claim.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

configMapGenerator:
  - name: config
    envs:
      - config.env

secretGenerator:
  - name: secrets
    envs:
      - secrets.env

images:
  - name: ghcr.io/happier-dev/relay-server
    newTag: stable@sha256:5bb3959bdecc54e9ef96bfd31ccd55ac1be5efb85f179856a43c7b4b0a048332
