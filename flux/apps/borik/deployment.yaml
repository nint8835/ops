apiVersion: apps/v1
kind: Deployment

metadata:
  name: borik

spec:
  selector:
    matchLabels:
      app: borik

  replicas: 1
  template:
    metadata:
      labels:
        app: borik

    spec:
      containers:
        - name: borik
          image: ghcr.io/fogo-sh/borik

          env:
            - name: APP_ID
              value: "774024240767696897"
            - name: REGISTER_SLASH_COMMANDS_GLOBALLY
              value: "true"
            - name: PREFIXES
              value: "borik!|,"

          envFrom:
            - secretRef:
                name: secrets
              prefix: BORIK_

          resources:
            requests:
              memory: "4Gi"
              cpu: "500m"
            limits:
              memory: "6Gi"
              cpu: "1"

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # TODO: Make true once the container image runs as non-root
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
