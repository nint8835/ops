apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shopkeeper
  namespace: flux-system
spec:
  interval: 1h0m0s
  dependsOn:
    - name: traefik-configs
    - name: cert-manager-configs
    - name: nfs-csi
  sourceRef:
    kind: ExternalArtifact
    name: shopkeeper
  path: './shopkeeper'
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: shopkeeper
      namespace: shopkeeper
  decryption:
    provider: sops
