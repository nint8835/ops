apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
  namespace: flux-system
spec:
  interval: 1h0m0s
  dependsOn:
    - name: traefik-configs
    - name: cert-manager-configs
    - name: nfs-csi
    - name: keda
    - name: cloudnativepg
  sourceRef:
    kind: ExternalArtifact
    name: immich
  path: './'
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: immich-machine-learning
      namespace: immich
    - apiVersion: apps/v1
      kind: Deployment
      name: immich-server
      namespace: immich
    - apiVersion: apps/v1
      kind: Deployment
      name: immich-worker
      namespace: immich
