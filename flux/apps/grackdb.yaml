apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grackdb
  namespace: flux-system
spec:
  interval: 1h0m0s
  dependsOn:
    - name: cert-manager-configs
    - name: nfs-csi
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: 'flux/apps/grackdb'
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: grackdb
      namespace: grackdb
  decryption:
    provider: sops
