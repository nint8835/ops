apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: coder
  namespace: flux-system

spec:
  interval: 1h0m0s
  dependsOn:
    - name: traefik-configs
    - name: cert-manager-configs
    - name: nfs-csi
    - name: cloudnativepg
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: 'flux/apps/coder'
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: coder
      namespace: coder
  decryption:
    provider: sops
