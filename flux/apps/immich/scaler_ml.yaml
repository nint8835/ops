apiVersion: keda.sh/v1alpha1
kind: ScaledObject

metadata:
  name: immich-machine-learning

spec:
  scaleTargetRef:
    name: immich-machine-learning

  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 300

  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda.svc.cluster.local:9090
        interceptorRoute: immich-machine-learning
