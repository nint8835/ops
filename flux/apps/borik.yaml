apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: borik
  namespace: flux-system
spec:
  interval: 1h0m0s
  sourceRef:
    kind: ExternalArtifact
    name: borik
  path: './'
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: borik
      namespace: borik
  decryption:
    provider: sops
