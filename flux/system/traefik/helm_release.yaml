apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: traefik

spec:
  interval: 1h0m0s
  releaseName: traefik
  maxHistory: 3

  chart:
    spec:
      chart: traefik
      version: '41.6.1'
      sourceRef:
        kind: HelmRepository
        name: traefik
      interval: 1h0m0s

  values:
    accessLog:
      enabled: true
      format: json
    log:
      format: json
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    deployment:
      kind: DaemonSet
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 256Mi
    service:
      spec:
        externalTrafficPolicy: Local
    additionalArguments:
      - --entrypoints.web.transport.respondingTimeouts.readTimeout=300s
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=300s
