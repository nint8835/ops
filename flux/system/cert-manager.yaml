apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: cert-manager
  namespace: flux-system

spec:
  interval: 1h0m0s
  sourceRef:
    kind: ExternalArtifact
    name: cert-manager
  path: './'
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
