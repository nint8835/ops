apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: nfs-csi
  namespace: flux-system

spec:
  interval: 1h0m0s
  sourceRef:
    kind: ExternalArtifact
    name: nfs-csi
  path: './'
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: csi-driver-nfs
      namespace: kube-system
