apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: keda
  namespace: flux-system

spec:
  interval: 1h0m0s
  sourceRef:
    kind: ExternalArtifact
    name: keda
  path: './'
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: keda
      namespace: keda
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: keda-http-add-on
      namespace: keda
