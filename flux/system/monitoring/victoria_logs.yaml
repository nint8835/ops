apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: victoria-logs

spec:
  interval: 1h0m0s
  releaseName: victoria-logs
  maxHistory: 3

  chart:
    spec:
      chart: victoria-logs-single
      version: '0.13.10'
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
      interval: 1h0m0s

  values:
    server:
      extraArgs:
        defaultMsgValue: No log message
      persistentVolume:
        storageClassName: nfs-csi
    vector:
      enabled: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
