apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: tailscale
  namespace: flux-system

spec:
  interval: 1h0m0s
  sourceRef:
    kind: ExternalArtifact
    name: tailscale
  path: './'
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tailscale-operator
      namespace: tailscale
