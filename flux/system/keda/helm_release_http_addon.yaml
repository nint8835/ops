apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: keda-http-add-on

spec:
  interval: 1h0m0s
  releaseName: keda-http-add-on
  maxHistory: 3
  dependsOn:
    - name: keda

  chart:
    spec:
      chart: keda-add-ons-http
      version: '0.16.0'
      sourceRef:
        kind: HelmRepository
        name: keda
      interval: 1h0m0s
