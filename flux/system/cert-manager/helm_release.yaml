apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: cert-manager

spec:
  interval: 1h0m0s
  releaseName: cert-manager
  maxHistory: 3

  chart:
    spec:
      chart: cert-manager
      version: 'v1.21.2'
      sourceRef:
        kind: HelmRepository
        name: cert-manager
      interval: 1h0m0s

  values:
    crds:
      enabled: true
      keep: true
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 96Mi
    cainjector:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 128Mi
    webhook:
      resources:
        requests:
          memory: 16Mi
        limits:
          memory: 64Mi
