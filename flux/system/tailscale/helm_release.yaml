apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: tailscale-operator

spec:
  interval: 1h0m0s
  releaseName: tailscale-operator
  maxHistory: 3

  chart:
    spec:
      chart: tailscale-operator
      version: '1.102.4'
      sourceRef:
        kind: HelmRepository
        name: tailscale
      interval: 1h0m0s
  
  values:
    operatorConfig:
      image:
        repository: ghcr.io/tailscale/k8s-operator
    
    proxyConfig:
      image:
        repository: ghcr.io/tailscale/tailscale
