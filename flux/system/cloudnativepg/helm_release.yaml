apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: cloudnativepg

spec:
  interval: 1h0m0s
  releaseName: cnpg
  maxHistory: 3

  chart:
    spec:
      chart: cloudnative-pg
      version: '0.29.1'
      sourceRef:
        kind: HelmRepository
        name: cloudnativepg
      interval: 1h0m0s

  values:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 384Mi
