apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: cloudnativepg
  namespace: flux-system

spec:
  interval: 1h0m0s
  sourceRef:
    kind: ExternalArtifact
    name: cloudnativepg
  path: './'
  prune: true
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnativepg
      namespace: cnpg-system
