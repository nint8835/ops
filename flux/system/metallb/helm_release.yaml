apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: metallb

spec:
  interval: 1h0m0s
  releaseName: metallb
  maxHistory: 3

  chart:
    spec:
      chart: metallb
      version: '0.16.1'
      sourceRef:
        kind: HelmRepository
        name: metallb
      interval: 1h0m0s

  values:
    frrk8s:
      enabled: false
    speaker:
      frr:
        enabled: false
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 128Mi
    controller:
      resources:
        requests:
          memory: 48Mi
        limits:
          memory: 96Mi
