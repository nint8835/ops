apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: webhook
  namespace: flux-system

spec:
  interval: 1h0m0s
  dependsOn:
    - name: cert-manager-configs
  sourceRef:
    kind: ExternalArtifact
    name: webhook
  path: './'
  prune: true
  timeout: 5m
  decryption:
    provider: sops
