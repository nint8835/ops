apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease

metadata:
  name: metrics-server

spec:
  interval: 1h0m0s
  releaseName: metrics-server
  maxHistory: 3

  chart:
    spec:
      chart: metrics-server
      version: '3.14.0'
      sourceRef:
        kind: HelmRepository
        name: metrics-server
      interval: 1h0m0s

  values:
    args:
      - --kubelet-insecure-tls
