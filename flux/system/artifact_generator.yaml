    - name: bookorbit
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/apps/bookorbit/**'
          to: '@artifact/'
    - name: coder
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/apps/coder/**'
          to: '@artifact/'
    - name: grackdb
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/apps/grackdb/**'
          to: '@artifact/'
    - name: immich
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/apps/immich/**'
          to: '@artifact/'
    - name: miniflux
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/apps/miniflux/**'
          to: '@artifact/'
    - name: ntv-webcam-scraper
