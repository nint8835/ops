    - name: shopkeeper
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/apps/shopkeeper/**'
          to: '@artifact/shopkeeper/'
        - from: '@repo/flux/apps/_bases/shopkeeper/**'
          to: '@artifact/_bases/shopkeeper/'
    - name: shopkeeper-cts
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/apps/shopkeeper-cts/**'
