apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator

metadata:
  name: flux-services
  namespace: flux-system

spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: flux-system
  # Leave revision unset so only changes to each artifact's contents change it.
  artifacts:
    - name: cloudnativepg
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/system/cloudnativepg/**'
          to: '@artifact/'
    - name: metrics-server
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/system/metrics-server/**'
          to: '@artifact/'
    - name: keda
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/system/keda/**'
          to: '@artifact/'
    - name: monitoring
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/system/monitoring/**'
          to: '@artifact/'
    - name: nfs-csi
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/system/nfs-csi/**'
          to: '@artifact/'
    - name: cert-manager
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/system/cert-manager/**'
          to: '@artifact/'
    - name: cert-manager-configs
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/system/cert-manager-configs/**'
          to: '@artifact/'
    - name: webhook
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/system/webhook/**'
          to: '@artifact/'
    - name: traefik
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/system/traefik/**'
          to: '@artifact/'
    - name: traefik-configs
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/system/traefik-configs/**'
          to: '@artifact/'
    - name: metallb
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/system/metallb/**'
          to: '@artifact/'
    - name: metallb-configs
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/system/metallb-configs/**'
          to: '@artifact/'
    - name: borik
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/apps/borik/**'
          to: '@artifact/'
    - name: gramfel
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/apps/gramfel/**'
          to: '@artifact/'
    - name: cloudflare-ddns
      originRevision: '@repo'
      copy:
        - from: '@repo/flux/apps/cloudflare-ddns/**'
          to: '@artifact/'
